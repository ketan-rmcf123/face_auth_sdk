[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face-auth-sdk"
version = "1.0.0"
description = "Production Face Authentication & Anti-Spoofing Liveness SDK"
authors = [{ name = "Ketan", email = "ketanpalankar123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pillow>=10.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=8.0.0",
]
